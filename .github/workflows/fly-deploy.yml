# See https://docs.fly.io/launch/continuous-deployment-with-github-actions

name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: bun
      - run: mise run check

  changes:
    name: Check for app changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Files that never reach the deployed site: docs, tests, dev scripts and CI/tool config. Anything else deploys.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with, deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"; echo "$changed"
          app=$(echo "$changed" | grep -vE '\.md$|^LICENSE$|^docs/|^test/|\.test\.tsx?$|^scripts/|^\.github/|^\.claude/|^\.gitignore$|^mise\.(toml|lock)$' || true)
          if [ -n "$app" ]; then
            echo "App files changed, deploying:"; echo "$app"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, tests, dev scripts or tooling changed, skipping the deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy app
    needs: [test, changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: flyctl
      - run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
