map $http_fly_client_ip $client_key {
  default $http_fly_client_ip;
  ""      $binary_remote_addr;
}

limit_req_zone $client_key zone=req_per_ip:10m rate=20r/s;
limit_conn_zone $client_key zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  limit_req zone=req_per_ip burst=40 nodelay;
  limit_conn conn_per_ip 20;

  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 15s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location ^~ /.well-known/ {
    try_files $uri =404;
  }

  location ~ /\. {
    return 404;
  }

  location /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    limit_except GET HEAD {
      deny all;
    }
    try_files $uri $uri/ /index.html;
  }
}
