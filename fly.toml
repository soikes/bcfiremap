# fly.toml app configuration file generated for bcfiremap on 2026-11-11T22:32:53-07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bcfiremap'
primary_region = 'sea'

[build]
  [build.args]
    EXPO_PUBLIC_EXAMPLE_BANS = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
